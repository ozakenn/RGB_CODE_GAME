<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111827">

  <title>RGB CODE CHALLENGE</title>

  <style>
    :root {
      color-scheme: light dark;

      --background: #f1f5f9;
      --surface: #ffffff;
      --surface-sub: #f8fafc;
      --border: #dbe3ec;

      --text: #172033;
      --text-sub: #64748b;

      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #059669;

      --shadow:
        0 10px 30px rgba(15, 23, 42, 0.08);

      --radius-large: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #09111f;
        --surface: #111c2e;
        --surface-sub: #17243a;
        --border: #2a3952;

        --text: #e5edf8;
        --text-sub: #9babc2;

        --primary: #3b82f6;
        --primary-hover: #60a5fa;

        --shadow:
          0 12px 32px rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--background);
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;

      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(32px, env(safe-area-inset-bottom));
    }

    .app-header {
      margin-bottom: 20px;
      text-align: center;
    }

    .app-title {
      margin: 0;

      font-size: clamp(24px, 7vw, 38px);
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .app-description {
      margin: 8px 0 0;

      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;

      margin-bottom: 16px;
      padding: 6px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .tab-button {
      min-height: 46px;
      padding: 8px;

      color: var(--text-sub);
      background: transparent;
      border: 0;
      border-radius: 11px;

      font-weight: 800;
      cursor: pointer;
    }

    .tab-button.active {
      color: #ffffff;
      background: var(--primary);
    }

    .tab-button:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(59, 130, 246, 0.38);
      outline-offset: 2px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      padding: 20px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .card + .card {
      margin-top: 16px;
    }

    .section-title {
      margin: 0 0 16px;

      font-size: 20px;
      font-weight: 900;
    }

    .question-color {
      width: 100%;
      min-height: 190px;
      aspect-ratio: 16 / 8;

      border: 1px solid rgba(127, 127, 127, 0.25);
      border-radius: 18px;

      transition: background-color 180ms ease;
    }

    .input-label {
      display: block;

      margin-top: 20px;
      margin-bottom: 8px;

      color: var(--text-sub);
      font-size: 14px;
      font-weight: 800;
    }

    .hex-input-area {
      display: flex;
      align-items: center;

      min-height: 58px;
      padding: 0 16px;

      background: var(--surface-sub);
      border: 2px solid var(--border);
      border-radius: 14px;
    }

    .hex-input-area:focus-within {
      border-color: var(--primary);
    }

    .hex-prefix {
      color: var(--text);

      font-family: ui-monospace, monospace;
      font-size: 26px;
      font-weight: 900;
    }

    .hex-input {
      width: 100%;
      min-width: 0;
      padding: 12px 6px;

      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;

      font-family: ui-monospace, monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /*
      回答欄にグレーで表示されていた入力例を、
      黒色の000000に変更。
      左側の#と合わせて#000000と表示される。
    */
    .hex-input::placeholder {
      color: #bbbbbb;
      opacity: 1;
    }

    .message {
      min-height: 22px;
      margin: 8px 0 0;

      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;

      margin-top: 14px;
    }

    .button-row.two-columns {
      grid-template-columns: 1fr 1fr;
    }

    .main-button,
    .secondary-button,
    .danger-button {
      min-height: 52px;
      padding: 12px 16px;

      border: 0;
      border-radius: 13px;

      font-weight: 900;
      cursor: pointer;
    }

    .main-button {
      color: #ffffff;
      background: var(--primary);
    }

    .main-button:hover {
      background: var(--primary-hover);
    }

    .main-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .secondary-button {
      color: var(--text);
      background: var(--surface-sub);
      border: 1px solid var(--border);
    }

    .danger-button {
      color: #ffffff;
      background: var(--danger);
    }

    .result-card {
      display: none;
    }

    .result-card.visible {
      display: block;
    }

    .score-area {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 18px;
    }

    .score-label {
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 800;
    }

    .score-value {
      margin-top: 2px;

      font-size: clamp(34px, 10vw, 52px);
      font-weight: 950;
      line-height: 1;
    }

    .rank-badge {
      display: grid;
      place-items: center;

      width: 70px;
      height: 70px;

      color: #ffffff;
      background: #334155;
      border-radius: 18px;

      font-size: 34px;
      font-weight: 950;
    }

    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-result {
      overflow: hidden;

      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .result-color-box {
      height: 120px;
      border-bottom: 1px solid var(--border);
    }

    .result-color-info {
      padding: 12px;
    }

    .small-label {
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
    }

    .color-code {
      margin-top: 3px;

      font-family: ui-monospace, monospace;
      font-size: clamp(17px, 5vw, 23px);
      font-weight: 900;
    }

    .difference-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;

      margin-top: 14px;
    }

    .difference-item {
      padding: 12px 6px;

      text-align: center;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .difference-channel {
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
    }

    .difference-value {
      margin-top: 3px;

      font-family: ui-monospace, monospace;
      font-size: 19px;
      font-weight: 900;
    }

    .practice-preview {
      width: 100%;
      height: 210px;

      border: 1px solid rgba(127, 127, 127, 0.25);
      border-radius: 18px;

      transition: background-color 100ms linear;
    }

    .practice-code {
      margin: 16px 0 4px;

      text-align: center;
      font-family: ui-monospace, monospace;
      font-size: clamp(30px, 10vw, 50px);
      font-weight: 950;
      letter-spacing: 0.06em;
    }

    .practice-rgb {
      margin: 0 0 20px;

      text-align: center;
      color: var(--text-sub);
      font-family: ui-monospace, monospace;
      font-weight: 800;
    }

    .slider-group + .slider-group {
      margin-top: 20px;
    }

    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 9px;
    }

    .slider-name {
      font-weight: 900;
    }

    .slider-number {
      width: 76px;
      min-height: 42px;
      padding: 6px 8px;

      color: var(--text);
      text-align: center;

      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 10px;

      font-family: ui-monospace, monospace;
      font-weight: 900;
    }

    input[type="range"] {
      width: 100%;
      height: 26px;
      margin: 0;

      cursor: pointer;
      accent-color: var(--primary);
    }

    .history-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;

      margin-bottom: 16px;
    }

    .summary-item {
      padding: 13px 8px;

      text-align: center;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .summary-label {
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 800;
    }

    .summary-value {
      margin-top: 3px;

      font-size: 19px;
      font-weight: 950;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-empty {
      padding: 30px 12px;

      text-align: center;
      color: var(--text-sub);

      background: var(--surface-sub);
      border-radius: 14px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;

      padding: 12px;

      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .history-colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;

      width: 52px;
      height: 52px;

      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .history-codes {
      min-width: 0;

      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.6;
    }

    .history-codes div {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-score {
      text-align: right;
    }

    .history-percentage {
      font-size: 18px;
      font-weight: 950;
    }

    .history-rank {
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
    }

    .footer-note {
      margin: 16px 4px 0;

      text-align: center;
      color: var(--text-sub);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 430px) {
      .card {
        padding: 16px;
      }

      .question-color {
        min-height: 170px;
      }

      .comparison {
        gap: 8px;
      }

      .result-color-box {
        height: 96px;
      }

      .history-item {
        grid-template-columns: 44px 1fr auto;
        gap: 9px;
      }

      .history-colors {
        width: 44px;
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">RGB CODE CHALLENGE</h1>

      <p class="app-description">
        表示された色を見て、6桁のHEXカラーコードを当てよう
      </p>
    </header>

    <nav class="tabs" aria-label="ゲームモード">
      <button
        type="button"
        class="tab-button active"
        data-screen="challenge"
      >
        チャレンジ
      </button>

      <button
        type="button"
        class="tab-button"
        data-screen="practice"
      >
        RGB練習
      </button>

      <button
        type="button"
        class="tab-button"
        data-screen="history"
      >
        履歴
      </button>
    </nav>

    <!-- チャレンジモード -->
    <section
      id="challenge"
      class="screen active"
      aria-labelledby="challenge-title"
    >
      <div class="card">
        <h2 id="challenge-title" class="section-title">
          この色のコードは？
        </h2>

        <div
          id="questionColor"
          class="question-color"
          aria-label="問題の色"
        ></div>

        <label class="input-label" for="answerInput">
          6桁のHEXコード
        </label>

        <div class="hex-input-area">
          <span class="hex-prefix">#</span>

          <input
            id="answerInput"
            class="hex-input"
            type="text"
            inputmode="text"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="000000"
            aria-describedby="inputMessage"
          >
        </div>

        <p
          id="inputMessage"
          class="message"
          aria-live="polite"
        ></p>

        <div class="button-row">
          <button
            id="answerButton"
            type="button"
            class="main-button"
          >
            回答する
          </button>
        </div>
      </div>

      <div id="resultCard" class="card result-card">
        <div class="score-area">
          <div>
            <div class="score-label">RGB近似率</div>
            <div id="scoreValue" class="score-value">0.0%</div>
          </div>

          <div id="rankBadge" class="rank-badge">D</div>
        </div>

        <div class="comparison">
          <div class="color-result">
            <div
              id="correctColorBox"
              class="result-color-box"
            ></div>

            <div class="result-color-info">
              <div class="small-label">問題</div>
              <div id="correctCode" class="color-code">
                #000000
              </div>
            </div>
          </div>

          <div class="color-result">
            <div
              id="answerColorBox"
              class="result-color-box"
            ></div>

            <div class="result-color-info">
              <div class="small-label">回答</div>
              <div id="answerCode" class="color-code">
                #000000
              </div>
            </div>
          </div>
        </div>

        <div class="difference-grid">
          <div class="difference-item">
            <div class="difference-channel">R差分</div>
            <div id="differenceR" class="difference-value">0</div>
          </div>

          <div class="difference-item">
            <div class="difference-channel">G差分</div>
            <div id="differenceG" class="difference-value">0</div>
          </div>

          <div class="difference-item">
            <div class="difference-channel">B差分</div>
            <div id="differenceB" class="difference-value">0</div>
          </div>
        </div>

        <div class="button-row">
          <button
            id="nextButton"
            type="button"
            class="main-button"
          >
            次の問題
          </button>
        </div>
      </div>
    </section>

    <!-- RGB練習モード -->
    <section
      id="practice"
      class="screen"
      aria-labelledby="practice-title"
    >
      <div class="card">
        <h2 id="practice-title" class="section-title">
          RGBスライダー練習
        </h2>

        <div
          id="practicePreview"
          class="practice-preview"
          aria-label="選択中の色"
        ></div>

        <div id="practiceCode" class="practice-code">
          #7FA840
        </div>

        <p id="practiceRgb" class="practice-rgb">
          rgb(127, 168, 64)
        </p>

        <div class="slider-group">
          <div class="slider-header">
            <label class="slider-name" for="redRange">
              R・赤
            </label>

            <input
              id="redNumber"
              class="slider-number"
              type="number"
              min="0"
              max="255"
              value="127"
              aria-label="赤の数値"
            >
          </div>

          <input
            id="redRange"
            type="range"
            min="0"
            max="255"
            value="127"
          >
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <label class="slider-name" for="greenRange">
              G・緑
            </label>

            <input
              id="greenNumber"
              class="slider-number"
              type="number"
              min="0"
              max="255"
              value="168"
              aria-label="緑の数値"
            >
          </div>

          <input
            id="greenRange"
            type="range"
            min="0"
            max="255"
            value="168"
          >
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <label class="slider-name" for="blueRange">
              B・青
            </label>

            <input
              id="blueNumber"
              class="slider-number"
              type="number"
              min="0"
              max="255"
              value="64"
              aria-label="青の数値"
            >
          </div>

          <input
            id="blueRange"
            type="range"
            min="0"
            max="255"
            value="64"
          >
        </div>

        <div class="button-row two-columns">
          <button
            id="randomPracticeButton"
            type="button"
            class="secondary-button"
          >
            ランダム
          </button>

          <button
            id="copyCodeButton"
            type="button"
            class="main-button"
          >
            コードをコピー
          </button>
        </div>

        <p
          id="copyMessage"
          class="message"
          aria-live="polite"
        ></p>
      </div>
    </section>

    <!-- 履歴 -->
    <section
      id="history"
      class="screen"
      aria-labelledby="history-title"
    >
      <div class="card">
        <h2 id="history-title" class="section-title">
          回答履歴
        </h2>

        <div class="history-summary">
          <div class="summary-item">
            <div class="summary-label">回答数</div>
            <div id="totalCount" class="summary-value">0</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">平均</div>
            <div id="averageScore" class="summary-value">0.0%</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">最高</div>
            <div id="bestScore" class="summary-value">0.0%</div>
          </div>
        </div>

        <div id="historyList" class="history-list"></div>

        <div class="button-row">
          <button
            id="clearHistoryButton"
            type="button"
            class="danger-button"
          >
            履歴をすべて消去
          </button>
        </div>
      </div>
    </section>

    <p class="footer-note">
      近似率はRGB空間上の直線距離から計算しています。<br>
      履歴はこの端末のブラウザー内に保存されます。
    </p>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "rgb-code-challenge-history-v1";
    const MAX_HISTORY = 100;

    /*
      前回の出題と比較するため、最初はnullにする。
      最初の問題はinitialize()内のshowNewQuestion()で生成する。
    */
    let currentQuestion = null;
    let questionAnswered = false;
    let history = loadHistory();

    const questionColor =
      document.getElementById("questionColor");

    const answerInput =
      document.getElementById("answerInput");

    const inputMessage =
      document.getElementById("inputMessage");

    const answerButton =
      document.getElementById("answerButton");

    const nextButton =
      document.getElementById("nextButton");

    const resultCard =
      document.getElementById("resultCard");

    const scoreValue =
      document.getElementById("scoreValue");

    const rankBadge =
      document.getElementById("rankBadge");

    const correctColorBox =
      document.getElementById("correctColorBox");

    const answerColorBox =
      document.getElementById("answerColorBox");

    const correctCode =
      document.getElementById("correctCode");

    const answerCode =
      document.getElementById("answerCode");

    const differenceR =
      document.getElementById("differenceR");

    const differenceG =
      document.getElementById("differenceG");

    const differenceB =
      document.getElementById("differenceB");

    const practicePreview =
      document.getElementById("practicePreview");

    const practiceCode =
      document.getElementById("practiceCode");

    const practiceRgb =
      document.getElementById("practiceRgb");

    const redRange =
      document.getElementById("redRange");

    const greenRange =
      document.getElementById("greenRange");

    const blueRange =
      document.getElementById("blueRange");

    const redNumber =
      document.getElementById("redNumber");

    const greenNumber =
      document.getElementById("greenNumber");

    const blueNumber =
      document.getElementById("blueNumber");

    const randomPracticeButton =
      document.getElementById("randomPracticeButton");

    const copyCodeButton =
      document.getElementById("copyCodeButton");

    const copyMessage =
      document.getElementById("copyMessage");

    const historyList =
      document.getElementById("historyList");

    const totalCount =
      document.getElementById("totalCount");

    const averageScore =
      document.getElementById("averageScore");

    const bestScore =
      document.getElementById("bestScore");

    const clearHistoryButton =
      document.getElementById("clearHistoryButton");

    initialize();

    function initialize() {
      setupTabs();
      setupChallenge();
      setupPractice();
      setupHistory();

      showNewQuestion();
      updatePractice();
      renderHistory();
    }

    /* ------------------------------
       タブ切り替え
    ------------------------------ */

    function setupTabs() {
      const tabButtons =
        document.querySelectorAll(".tab-button");

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const screenId = button.dataset.screen;

          tabButtons.forEach((item) => {
            item.classList.remove("active");
          });

          document
            .querySelectorAll(".screen")
            .forEach((screen) => {
              screen.classList.remove("active");
            });

          button.classList.add("active");

          document
            .getElementById(screenId)
            .classList.add("active");

          if (screenId === "history") {
            renderHistory();
          }
        });
      });
    }

    /* ------------------------------
       チャレンジモード
    ------------------------------ */

    function setupChallenge() {
      answerInput.addEventListener("input", () => {
        const cleaned = answerInput.value
          .replace(/[^0-9a-fA-F]/g, "")
          .slice(0, 6)
          .toUpperCase();

        answerInput.value = cleaned;
        inputMessage.textContent = "";
      });

      answerInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submitAnswer();
        }
      });

      answerButton.addEventListener(
        "click",
        submitAnswer
      );

      nextButton.addEventListener(
        "click",
        showNewQuestion
      );
    }

    function showNewQuestion() {
      /*
        現在の問題をpreviousQuestionとして保存する。
        新しい問題は、前回のコードから最低0x100離す。
      */
      const previousQuestion = currentQuestion;

      currentQuestion =
        createRandomColor(previousQuestion);

      const questionHex =
        rgbToHex(
          currentQuestion.r,
          currentQuestion.g,
          currentQuestion.b
        );

      questionAnswered = false;

      questionColor.style.backgroundColor =
        questionHex;

      answerInput.value = "";
      answerInput.disabled = false;
      answerButton.disabled = false;

      inputMessage.textContent = "";
      resultCard.classList.remove("visible");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      setTimeout(() => {
        answerInput.focus();
      }, 150);
    }

    function submitAnswer() {
      if (questionAnswered) {
        return;
      }

      const normalized =
        normalizeHex(answerInput.value);

      if (!normalized) {
        inputMessage.textContent =
          "0～9、A～Fを使って6桁で入力してください。";

        answerInput.focus();
        return;
      }

      const answerRgb =
        hexToRgb(normalized);

      const result =
        calculateSimilarity(
          currentQuestion,
          answerRgb
        );

      const differences = {
        r: answerRgb.r - currentQuestion.r,
        g: answerRgb.g - currentQuestion.g,
        b: answerRgb.b - currentQuestion.b
      };

      const rank =
        getRank(result.similarity);

      const targetHex =
        rgbToHex(
          currentQuestion.r,
          currentQuestion.g,
          currentQuestion.b
        );

      questionAnswered = true;
      answerInput.disabled = true;
      answerButton.disabled = true;

      displayResult({
        targetHex,
        answerHex: normalized,
        similarity: result.similarity,
        rank,
        differences
      });

      addHistory({
        id: Date.now(),
        targetHex,
        answerHex: normalized,
        similarity: result.similarity,
        rank,
        date: new Date().toLocaleString("ja-JP")
      });
    }

    function displayResult(data) {
      scoreValue.textContent =
        `${data.similarity.toFixed(1)}%`;

      rankBadge.textContent =
        data.rank.label;

      rankBadge.style.background =
        data.rank.color;

      correctColorBox.style.backgroundColor =
        data.targetHex;

      answerColorBox.style.backgroundColor =
        data.answerHex;

      correctCode.textContent =
        data.targetHex;

      answerCode.textContent =
        data.answerHex;

      differenceR.textContent =
        formatDifference(data.differences.r);

      differenceG.textContent =
        formatDifference(data.differences.g);

      differenceB.textContent =
        formatDifference(data.differences.b);

      resultCard.classList.add("visible");

      setTimeout(() => {
        resultCard.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 100);
    }

    function calculateSimilarity(target, answer) {
      const redDifference =
        target.r - answer.r;

      const greenDifference =
        target.g - answer.g;

      const blueDifference =
        target.b - answer.b;

      const distance = Math.sqrt(
        redDifference ** 2 +
        greenDifference ** 2 +
        blueDifference ** 2
      );

      const maximumDistance =
        Math.sqrt(
          255 ** 2 +
          255 ** 2 +
          255 ** 2
        );

      const similarity =
        Math.max(
          0,
          Math.min(
            100,
            (1 - distance / maximumDistance) * 100
          )
        );

      return {
        distance,
        similarity
      };
    }

    function getRank(similarity) {
      if (similarity >= 99.95) {
        return {
          label: "P",
          color: "#7C3AED"
        };
      }

      if (similarity >= 95) {
        return {
          label: "S",
          color: "#DB2777"
        };
      }

      if (similarity >= 90) {
        return {
          label: "A",
          color: "#2563EB"
        };
      }

      if (similarity >= 80) {
        return {
          label: "B",
          color: "#059669"
        };
      }

      if (similarity >= 70) {
        return {
          label: "C",
          color: "#D97706"
        };
      }

      return {
        label: "D",
        color: "#64748B"
      };
    }

    /* ------------------------------
       RGB練習モード
    ------------------------------ */

    function setupPractice() {
      connectRangeAndNumber(
        redRange,
        redNumber
      );

      connectRangeAndNumber(
        greenRange,
        greenNumber
      );

      connectRangeAndNumber(
        blueRange,
        blueNumber
      );

      randomPracticeButton.addEventListener(
        "click",
        randomizePractice
      );

      copyCodeButton.addEventListener(
        "click",
        copyPracticeCode
      );
    }

    function connectRangeAndNumber(
      range,
      numberInput
    ) {
      range.addEventListener("input", () => {
        numberInput.value = range.value;
        updatePractice();
      });

      numberInput.addEventListener("input", () => {
        const value =
          clampRgb(numberInput.value);

        if (numberInput.value !== "") {
          range.value = value;
          updatePractice();
        }
      });

      numberInput.addEventListener("blur", () => {
        const value =
          clampRgb(numberInput.value);

        numberInput.value = value;
        range.value = value;

        updatePractice();
      });
    }

    function updatePractice() {
      const red =
        clampRgb(redRange.value);

      const green =
        clampRgb(greenRange.value);

      const blue =
        clampRgb(blueRange.value);

      const hex =
        rgbToHex(red, green, blue);

      practicePreview.style.backgroundColor =
        hex;

      practiceCode.textContent =
        hex;

      practiceRgb.textContent =
        `rgb(${red}, ${green}, ${blue})`;

      copyMessage.textContent = "";
    }

    function randomizePractice() {
      const color =
        createRandomColor();

      redRange.value = color.r;
      greenRange.value = color.g;
      blueRange.value = color.b;

      redNumber.value = color.r;
      greenNumber.value = color.g;
      blueNumber.value = color.b;

      updatePractice();
    }

    async function copyPracticeCode() {
      const code =
        practiceCode.textContent;

      try {
        await navigator.clipboard.writeText(code);

        copyMessage.style.color =
          "var(--success)";

        copyMessage.textContent =
          `${code} をコピーしました。`;
      } catch (error) {
        copyMessage.style.color =
          "var(--danger)";

        copyMessage.textContent =
          `コピーできませんでした。コードは ${code} です。`;
      }
    }

    /* ------------------------------
       履歴
    ------------------------------ */

    function setupHistory() {
      clearHistoryButton.addEventListener(
        "click",
        () => {
          const shouldDelete =
            window.confirm(
              "回答履歴をすべて削除しますか？"
            );

          if (!shouldDelete) {
            return;
          }

          history = [];
          saveHistory();
          renderHistory();
        }
      );
    }

    function addHistory(record) {
      history.unshift(record);

      if (history.length > MAX_HISTORY) {
        history =
          history.slice(0, MAX_HISTORY);
      }

      saveHistory();
    }

    function renderHistory() {
      totalCount.textContent =
        history.length;

      if (history.length === 0) {
        averageScore.textContent = "0.0%";
        bestScore.textContent = "0.0%";

        historyList.innerHTML = `
          <div class="history-empty">
            まだ回答履歴がありません。<br>
            チャレンジモードで回答すると表示されます。
          </div>
        `;

        return;
      }

      const total =
        history.reduce(
          (sum, item) =>
            sum + Number(item.similarity || 0),
          0
        );

      const average =
        total / history.length;

      const best =
        Math.max(
          ...history.map(
            (item) =>
              Number(item.similarity || 0)
          )
        );

      averageScore.textContent =
        `${average.toFixed(1)}%`;

      bestScore.textContent =
        `${best.toFixed(1)}%`;

      historyList.innerHTML = "";

      history.forEach((item) => {
        const element =
          document.createElement("article");

        element.className =
          "history-item";

        const safeTarget =
          normalizeHex(item.targetHex) ||
          "#000000";

        const safeAnswer =
          normalizeHex(item.answerHex) ||
          "#000000";

        const safeScore =
          Number.isFinite(
            Number(item.similarity)
          )
            ? Number(item.similarity)
            : 0;

        const safeRank =
          typeof item.rank?.label === "string"
            ? item.rank.label
            : getRank(safeScore).label;

        element.innerHTML = `
          <div
            class="history-colors"
            aria-label="問題色と回答色"
          >
            <div style="background:${safeTarget}"></div>
            <div style="background:${safeAnswer}"></div>
          </div>

          <div class="history-codes">
            <div>問題 ${safeTarget}</div>
            <div>回答 ${safeAnswer}</div>
          </div>

          <div class="history-score">
            <div class="history-percentage">
              ${safeScore.toFixed(1)}%
            </div>

            <div class="history-rank">
              RANK ${escapeHtml(safeRank)}
            </div>
          </div>
        `;

        historyList.appendChild(element);
      });
    }

    function loadHistory() {
      try {
        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        return Array.isArray(parsed)
          ? parsed.slice(0, MAX_HISTORY)
          : [];
      } catch (error) {
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(history)
        );
      } catch (error) {
        console.warn(
          "履歴を保存できませんでした。",
          error
        );
      }
    }

    /* ------------------------------
       ランダム出題処理
    ------------------------------ */

    function createRandomColor(
      previousColor = null
    ) {
      let randomCode;

      /*
        0x000000～0xFFFFFFから整数を1つ選ぶ。

        候補数：
        0x1000000
        = 16^6
        = 16,777,216通り
      */
      do {
        randomCode =
          randomInteger(
            0x000000,
            0xFFFFFF
          );
      } while (
        previousColor !== null &&
        Math.abs(
          randomCode -
          rgbToInteger(
            previousColor.r,
            previousColor.g,
            previousColor.b
          )
        ) < 0x100
      );

      return integerToRgb(randomCode);
    }

    function randomInteger(minimum, maximum) {
      return Math.floor(
        Math.random() *
        (maximum - minimum + 1)
      ) + minimum;
    }

    /*
      RGBを#RRGGBBと同じ並びの整数にする。

      例：
      #123456 → 0x123456
    */
    function rgbToInteger(red, green, blue) {
      return (
        clampRgb(red) * 0x10000 +
        clampRgb(green) * 0x100 +
        clampRgb(blue)
      );
    }

    /*
      24ビット整数をRGBへ戻す。

      ゼロ埋めシフトではなく割り算を使い、
      符号付き32ビット変換を避けている。
    */
    function integerToRgb(value) {
      return {
        r: Math.floor(value / 0x10000),
        g: Math.floor(value / 0x100) & 0xFF,
        b: value & 0xFF
      };
    }

    /* ------------------------------
       色変換・共通処理
    ------------------------------ */

    function normalizeHex(value) {
      const cleaned =
        String(value)
          .trim()
          .replace(/^#/, "")
          .toUpperCase();

      if (!/^[0-9A-F]{6}$/.test(cleaned)) {
        return null;
      }

      return `#${cleaned}`;
    }

    function hexToRgb(hex) {
      const normalized =
        normalizeHex(hex);

      if (!normalized) {
        return null;
      }

      return {
        r: parseInt(
          normalized.slice(1, 3),
          16
        ),

        g: parseInt(
          normalized.slice(3, 5),
          16
        ),

        b: parseInt(
          normalized.slice(5, 7),
          16
        )
      };
    }

    function rgbToHex(red, green, blue) {
      return (
        "#" +
        toHex(red) +
        toHex(green) +
        toHex(blue)
      );
    }

    function toHex(value) {
      return clampRgb(value)
        .toString(16)
        .padStart(2, "0")
        .toUpperCase();
    }

    function clampRgb(value) {
      const number =
        Number(value);

      if (!Number.isFinite(number)) {
        return 0;
      }

      return Math.max(
        0,
        Math.min(
          255,
          Math.round(number)
        )
      );
    }

    function formatDifference(value) {
      if (value > 0) {
        return `+${value}`;
      }

      return String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
